{% extends 'menu.html' %}
{% block content %}
<section class="py-5 mt-4">
    <div class="container">
        <div class="row mb-5 text-center" data-aos="fade-down">
            <h2 class="fw-bold text-white display-6">CATÁLOGO DE <span class="text-warning">EQUIPAMENTOS</span></h2>
            <p class="text-white-50">Selecione um produto para ver especificações e solicitar orçamento.</p>
        </div>

        <div class="row g-4 justify-content-center">
            {% for s in servicos %}
            <div class="col-lg-3 col-md-4 col-6" data-aos="fade-up">
                <a href="{{ url_for('servico_detalhe', servico_id=s['id']) }}" class="text-decoration-none">
                    <div class="service-compact-card">
                        <div class="service-img-mini">
                            <img src="{{ s['imagem'] }}" alt="{{ s['titulo'] }}">
                        </div>
                        <div class="service-title-box">
                            <h6 class="fw-bold m-0">{{ s['titulo'] }}</h6>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
